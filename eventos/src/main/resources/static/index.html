<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Rental Events - Gerenciamento</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Gerenciamento de Locações (Rental Events)</h1>

    <!-- Navegação Simples -->
    <div class="menu-abas">
      <button type="button" class="btn-aba ativa" onclick="abrirAba('aba-equipamento')">Equipamentos</button>
      <button type="button" class="btn-aba" onclick="abrirAba('aba-usuario')">Usuários</button>
      <button type="button" class="btn-aba" onclick="abrirAba('aba-movimentacao')">Movimentações</button>
    </div>

    <!-- ================= ABA EQUIPAMENTO ================= -->
    <div id="aba-equipamento" class="conteudo-aba">
      <h2>Gerenciar Equipamentos</h2>
      <form id="formEquipamento">
        <input type="number" id="equip_id" placeholder="ID do Equipamento (para pesquisar/deletar)">
        <input type="text" id="equip_marca" placeholder="Marca (ex: JBL)">
        <input type="text" id="equip_modelo" placeholder="Modelo (ex: EON 615)">
        <input type="text" id="equip_categoria" placeholder="Categoria (ex: Som)">
        <input type="number" id="equip_potencia" placeholder="Potência (ex: 1000)">
        <input type="text" id="equip_material" placeholder="Material (ex: Alumínio)">
        <input type="number" id="equip_peso" placeholder="Peso (ex: 15)">
        <input type="number" id="equip_dimensoes" placeholder="Dimensões (ex: 50)">
        <input type="text" id="equip_cor" placeholder="Cor (ex: Preto)">
        <input type="number" id="equip_quantidade" placeholder="Quantidade (ex: 10)">
        <br>
        <button type="button" id="btnCadastrarEquip"><i class="fas fa-plus"></i> Cadastrar</button>
        <button type="button" id="btnPesquisarEquip"><i class="fas fa-search"></i> Pesquisar</button>
        <button type="button" id="btnDeletarEquip"><i class="fas fa-trash"></i> Deletar</button>
        <button type="button" id="btnLimparEquip"><i class="fas fa-eraser"></i> Limpar</button>
      </form>
    </div>

    <!-- ================= ABA USUÁRIO ================= -->
    <div id="aba-usuario" class="conteudo-aba" style="display: none;">
      <h2>Gerenciar Usuários</h2>
      <form id="formUsuario">
        <input type="number" id="user_id" placeholder="ID do Usuário (para pesquisar/deletar)">
        <input type="text" id="user_nome" placeholder="Nome do Usuário">
        <input type="email" id="user_email" placeholder="E-mail">
        <input type="text" id="user_cpf" placeholder="CPF (ex: 123.456.789-00)">
        <input type="date" id="user_dataNascimento" placeholder="Data de Nascimento">
        <br>
        <button type="button" id="btnCadastrarUser"><i class="fas fa-plus"></i> Cadastrar</button>
        <button type="button" id="btnPesquisarUser"><i class="fas fa-search"></i> Pesquisar</button>
        <button type="button" id="btnDeletarUser"><i class="fas fa-trash"></i> Deletar</button>
        <button type="button" id="btnLimparUser"><i class="fas fa-eraser"></i> Limpar</button>
      </form>
    </div>

    <!-- ================= ABA MOVIMENTAÇÃO ================= -->
    <div id="aba-movimentacao" class="conteudo-aba" style="display: none;">
      <h2>Gerenciar Movimentações</h2>
      <form id="formMovimentacao">
        <input type="number" id="mov_id" placeholder="ID da Movimentação (para pesquisar/deletar)">
        <input type="text" id="mov_usuario" placeholder="Nome do Usuário">
        <input type="date" id="mov_dataMovimentacao" placeholder="Data da Movimentação">
        <input type="text" id="mov_tipoDeMovimentacao" placeholder="Tipo de Movimentação (ex: Locação)">
        <input type="text" id="mov_modelo" placeholder="Modelo do Equipamento">
        <input type="number" id="mov_quantidade" placeholder="Quantidade">
        <br>
        <button type="button" id="btnCadastrarMov"><i class="fas fa-plus"></i> Cadastrar</button>
        <button type="button" id="btnPesquisarMov"><i class="fas fa-search"></i> Pesquisar</button>
        <button type="button" id="btnDeletarMov"><i class="fas fa-trash"></i> Deletar</button>
        <button type="button" id="btnLimparMov"><i class="fas fa-eraser"></i> Limpar</button>
      </form>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
